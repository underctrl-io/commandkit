packages:
  - packages/*
  - apps/*

preferWorkspacePackages: true

publicHoistPattern:
  - '@commandkit/*'

allowBuilds:
  '@swc/core': false
  cbor-extract: false
  core-js: false
  esbuild: true
  msgpackr-extract: false

catalogs:
  discordjs:
    discord.js: ^14.27.0
  build:
    typescript: ^5.9.3
    tsdown: ^0.22.14
  workflow:
    workflow: ^5.2.0
    '@workflow/builders': ^5.0.3
    '@workflow/rollup': ^5.0.3

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.24'
  - '@ai-sdk/google@4.0.19'
  - '@hono/node-server@2.0.11'
  - '@posthog/core@1.44.0'
  - ai@7.0.32
  - posthog-node@5.46.0
  - tar@7.5.3 || 7.5.4 || 7.5.7 || 7.5.8 || 7.5.10 || 7.5.11 || 7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - serialize-javascript@7.0.3 || 7.0.5
  - uuid@11.1.1
  - brace-expansion@1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.8 || 5.0.9
