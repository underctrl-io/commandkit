packages:
  - packages/*
  - apps/*

preferWorkspacePackages: true

publicHoistPattern:
  - '@commandkit/*'

allowBuilds:
  '@swc/core': false
  cbor-extract: false
  core-js: false
  esbuild: true
  msgpackr-extract: false

catalogs:
  discordjs:
    discord.js: ^14.27.0
  build:
    typescript: ^5.9.3
    tsdown: ^0.22.14
  workflow:
    workflow: ^5.2.0
    '@workflow/builders': ^5.0.3
    '@workflow/rollup': ^5.0.3

minimumReleaseAgeExclude:
  - use-macro
  - serialize-javascript@7.0.3 || 7.0.5
  - uuid@11.1.1
  - nanoid@5.1.11 || 5.1.16
  - devalue@5.9.3
  - braces@3.0.4
  - katex@0.18.2
  - postcss-selector-parser@7.1.6
  - tinypool@2.1.1 || 2.1.2
